apis:
- name: TrueContext REST API
  description: >-
    REST API for full programmatic access to TrueContext (ProntoForms) forms,
    submissions, users, and dispatch, available on the Elite tier. Supports
    HTTP GET/POST for bidirectional data, webhooks to push form data to any URL,
    and OData endpoints. Served at api.prontoforms.com under versioned /api/1.0/
    and /api/2.0/ paths; requests require authenticated API credentials (HTTP
    401 without them).
