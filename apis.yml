description: >-
  TrueContext (formerly ProntoForms) is an enterprise field-intelligence and
  mobile-workflow platform that helps field service teams capture rich data,
  guide technicians through smart context-aware forms, and connect frontline
  work to back-office systems. Its low-code platform covers mobile forms, guided
  workflow automation, connected data, dispatch, and reporting for industries
  such as field service, installation, maintenance and repair, inspections and
  compliance, EHS, industrial and medical equipment, and oil and gas. The
  platform exposes a REST API (v1.0 and v2.0 at api.prontoforms.com) for
  programmatic access to forms, submissions, users, and dispatch, plus webhooks,
  OData, and FTP/sFTP data connectors, with out-of-the-box integrations for
  ServiceNow, Salesforce, ServiceMax, and Microsoft.
